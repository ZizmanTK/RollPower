<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* The game fills whatever frame it is given (the itch embed, or the whole window in fullscreen). */
      @font-face { font-family: Rajdhani; src: url('TemplateData/Rajdhani-Bold.ttf'); font-weight: 700; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #060E1A; }
      #unity-container { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #060E1A; outline: none; }
      #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, rgba(6,14,26,.55), rgba(6,14,26,.92)), url('TemplateData/cover.jpg') center / cover;
        font-family: Rajdhani, 'Segoe UI', sans-serif; color: #fff; transition: opacity .4s; }
      #loader h1 { margin: 0; font-size: min(11vw, 96px); letter-spacing: .06em; line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
      #loader p { margin: .4em 0 1.4em; font-size: min(3.4vw, 22px); color: #FFB020; letter-spacing: .12em; }
      #bar { width: min(60vw, 420px); height: 8px; border-radius: 4px; background: rgba(41,182,246,.18); overflow: hidden; }
      #bar div { width: 0; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #FF7A1A, #FFB020); transition: width .2s; }
      #warning { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); font: 14px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader">
        <h1>ROLL POWER</h1>
        <p>ROLL TO CHOOSE YOUR WEAPON</p>
        <div id="bar"><div></div></div>
      </div>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var w = document.querySelector("#warning"), div = document.createElement('div');
        div.innerHTML = msg;
        div.style = 'padding: 10px; background: ' + (type == 'error' ? '#E53935; color: #fff' : '#FFB020');
        w.appendChild(div); w.style.display = 'block';
        if (type != 'error') setTimeout(function () { w.removeChild(div); w.style.display = w.children.length ? 'block' : 'none'; }, 5000);
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        var loader = document.querySelector("#loader"), bar = document.querySelector("#bar div");
        createUnityInstance(canvas, config, function (p) { bar.style.width = 100 * p + "%"; })
          .then(function () { loader.style.opacity = 0; setTimeout(function () { loader.remove(); }, 400); canvas.focus(); })
          .catch(function (message) { alert(message); });
      };
      document.body.appendChild(script);
      canvas.addEventListener('pointerdown', function () { canvas.focus(); });
    </script>
  </body>
</html>
